<body>
    <div id="app">
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <p>Cargando portafolio...</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        Ha ocurrido un error.
        <a href="" class="reload">Recargar</a>
        <a class="dismiss">X</a>
    </div>
    <script type="text/javascript">
  (function(l) {
    if (l.search[1] === '/' ) {
      var decoded = l.search.slice(1).split('&').map(function(s) {
        return s.replace(/~and~/g, '&')
      }).join('?');
      window.history.replaceState(null, null,
        l.pathname.slice(0, -1) + decoded + l.hash
      );
    }
  }(window.location))
</script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>

     <script>
        (function() {
            var redirect = sessionStorage.redirect;
            if (redirect) {
                sessionStorage.removeItem('redirect');
                // Extrae la ruta relativa (ej. /sobre-mi)
                var url = new URL(redirect);
                var path = url.pathname; // ej. /Portafolio/sobre-mi
                // Quita la parte del repositorio (Portafolio) para obtener la ruta interna
                var base = '/Portafolio';
                if (path.startsWith(base)) {
                    var target = path.substring(base.length); // ej. /sobre-mi
                    if (target && target !== '/') {
                        // Navega a la ruta usando el enrutador de Blazor (cambia el hash)
                        window.location.hash = target;
                    }
                }
            }
        })();
    </script>
</body>

</html>
